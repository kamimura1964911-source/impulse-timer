<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b48"><title>3分 衝動観察</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:system-ui,sans-serif;background:#f3f6f5;color:#173b48;margin:0;padding:18px}main{max-width:480px;margin:auto}h1{font-size:24px}section{background:white;padding:18px;border-radius:16px;margin:14px 0}#clock{font-size:70px;text-align:center;font-variant-numeric:tabular-nums;margin:16px}button,select{font:inherit;padding:13px;border-radius:12px;border:1px solid #b9c9c9}button{background:#173b48;color:white;cursor:pointer}button:disabled{opacity:.5}.wide{width:100%}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices button{background:#e4eeee;color:#173b48}.muted{color:#627579;font-size:13px}li{margin:10px 0}#status{min-height:24px}</style></head><body><main><h1>3分 衝動観察</h1><p>気づいたら押す。それだけで記録を開始。</p><section><div id="clock">03:00</div><button class="wide" id="start">3分スタート</button><p id="status" class="muted"></p><p class="muted">画面を閉じても開始時刻から残り時間を計算します。通知は保証されません。</p></section><section><h2>衝動の種類</h2><div class="choices" id="types"></div><h2>3分後の変化</h2><div class="choices" id="outcomes"></div><p class="muted">どちらも後から選べます。入力しなくても記録は残ります。</p></section><section><h2>記録 <span id="count"></span></h2><button id="export">CSVで保存</button> <button id="clear">全記録を削除</button><ul id="history"></ul></section></main><script>
const KEY='impulse-log-v1',ACTIVE='impulse-active-v1';let log=JSON.parse(localStorage.getItem(KEY)||'[]');let active=localStorage.getItem(ACTIVE);const $=id=>document.getElementById(id);const types=['酒を飲みたい','ちょっと食べたい','腹が立った','反論、否定したい','買いたい'];const outcomes=['落ち着いた','変わらない','強くなった','別のことを考えた'];function save(){localStorage.setItem(KEY,JSON.stringify(log));render()}function current(){return log.find(x=>x.id===active)}function setField(field,value){let r=current();if(!r&&log.length)r=log[0];if(!r)return;r[field]=value;save()}function buttons(id,values,field){$(id).replaceChildren(...values.map(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>setField(field,v);return b}))}function render(){ $('count').textContent=`(${log.length}回)`;$('history').replaceChildren(...log.slice(0,30).map(r=>{let li=document.createElement('li');li.textContent=`${new Date(r.at).toLocaleString('ja-JP')} ／ ${r.type||'未分類'} ／ ${r.outcome||'未記録'}`;return li}))}function tick(){let r=current();if(!r){$('clock').textContent='03:00';$('start').disabled=false;return}let left=Math.max(0,180-Math.floor((Date.now()-new Date(r.at).getTime())/1000));$('clock').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;$('start').disabled=left>0;$('status').textContent=left?'タイマー進行中':'3分経過しました。変化を記録できます。'}$('start').onclick=()=>{let r={id:String(Date.now()),at:new Date().toISOString(),type:'',outcome:''};log.unshift(r);active=r.id;localStorage.setItem(ACTIVE,active);save();tick()};$('export').onclick=()=>{let lines=[['日時','種類','3分後'],...log.map(r=>[new Date(r.at).toLocaleString('ja-JP'),r.type,r.outcome])];let csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='衝動観察記録.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('clear').onclick=()=>{if(confirm('すべての記録を削除しますか？')){log=[];active=null;localStorage.removeItem(ACTIVE);save();tick()}};buttons('types',types,'type');buttons('outcomes',outcomes,'outcome');render();tick();setInterval(tick,1000);
</script></body></html>
